name: telecaller_crm_simple
description: Simple Flutter mobile app for Telecaller CRM
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API - Only essential
  http: ^1.1.0

  # Local Storage - Only essential
  shared_preferences: ^2.2.2

  # Phone & Communication - Only essential
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

