name: telecaller_crm
description: Flutter mobile app for Telecaller CRM
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Phone & Communication
  url_launcher: ^6.2.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.2
  firebase_messaging: ^15.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
